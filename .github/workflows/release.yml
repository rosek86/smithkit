name: Publish smithkit to npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish (leave empty for verification only)'
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'rosek86/smithkit' &&
      (!inputs.release_tag || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.event.release.tag_name || github.sha }}
      release-tag: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
      package-artifact: npm-package

  publish:
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package
      - name: Check whether this exact archive is already published
        id: registry
        run: node scripts/release-status.mjs package
      - name: Publish the verified archive with npm trusted publishing
        if: steps.registry.outputs.published != 'true'
        env:
          NPM_ARCHIVE: ${{ steps.registry.outputs.archive }}
        run: npm publish "./package/$NPM_ARCHIVE" --access public --provenance --ignore-scripts
