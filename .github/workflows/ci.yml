name: Check and publish Smith chart

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smith-chart-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verification:
    uses: ./.github/workflows/verify.yml
    with:
      package-artifact: smithkit-package
      upload-pages: true

  check:
    needs: verification
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all verification jobs to pass
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
        run: test "$VERIFICATION_RESULT" = success

  deploy:
    needs: check
    if: >-
      github.repository == 'rosek86/smithkit' &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy the tested demo
        id: deployment
        uses: actions/deploy-pages@v5
